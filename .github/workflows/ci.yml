name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every action is pinned to a commit SHA
        run: |
          shopt -s nullglob
          files=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no workflow files found under .github/workflows"
            exit 1
          fi
          bad=0
          for f in "${files[@]}"; do
            rc=0
            hits=$(grep -nE '^[[:space:]-]*uses[:]' "$f") || rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "::error file=$f::grep failed with exit $rc"
              exit 1
            fi
            while IFS= read -r hit; do
              [ -n "$hit" ] || continue
              n=${hit%%:*}
              ref=$(printf '%s' "${hit#*:}" \
                | sed -E 's/[[:space:]]+#.*$//; s/^[[:space:]-]*uses[:][[:space:]]*//; s/[[:space:]]+$//' \
                | tr -d "\"'")
              if ! [[ $ref =~ @[0-9a-f]{40}$ ]]; then
                echo "::error file=$f,line=$n::\"$ref\" is not pinned to a 40-hex commit SHA (local ./ and docker:// refs are refused too)"
                bad=1
              fi
            done <<< "$hits"
          done
          exit "$bad"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Every module but src/main.ts is held to no panic
        run: node scripts/no-panic-list.mjs

      - name: The pinned nish, and the LLVM toolchain it links with
        uses: amritk/workflows/actions/setup-nish@d0672b6994cc142bccf836ab1e185b9be990e832

      # Plain: the profile-guided link takes about 18 minutes here, against
      # 3. The release builds with the profile and runs the regression cases
      # on that binary before it ships (release.yml's test).
      - name: Build
        env:
          NISHFMT_PGO: "0"
        run: npm run build

      - name: Regression cases
        run: npm test

      - name: Smoke-run the binary
        run: |
          ./dist/nishfmt --version
          printf 'int  main( ){return 0;}\n' > smoke.cpp
          test "$(./dist/nishfmt smoke.cpp)" = "int main() { return 0; }"

  # The one check to require: green only when every job above succeeded. A
  # job added to this workflow joins `needs` below.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: amritk/workflows/actions/ci-gate@8648bd998171e75f4d1fd5710f114d42257e1c3a # amritk/workflows#6, unreleased
        with:
          needs: ${{ toJSON(needs) }}
